spec_version: 2
id: spae-yolov8n-pose
base: yolov8n
task: pose
status: planned
dataset: rflysim-pose
tags: [self-designed, keypoint, pose, small-object, uav, air-to-air, spae, p2-head,
  adown, rflysim, sim2real]
notes: '= SPAE-YOLOv8n（SIoU + P2 浅层 + ADown + Efficient_UAVDet）+ 论文口径的 9 点机体关键点。


  按 Keypoint-Guided（T-RO 2024，预印本存于 docs/）落地三件事：① 点结构 = 1 个质心点 p0 + 8 个角点 p1~p8（§III-A-1
  原文）；② 3D 几何损失 L_rep（式 6/8）——只罚垂直于相机射线的横向偏差，论文消融里增益最大（10°10cm 提升 >10%）；③ 训练策略：前 15
  epoch 只用 2D 项，之后加入 L_rep（§IV-A-2）。


  本库对论文唯一一处**明确修正**：式 (8) 的文字把 v_i 说成「预测的关键点」，照字面取 v=预测像素坐标会得到与预测无关、梯度恒 0 的量；本库按几何唯一说得通的读法取「穿过预测点的相机射线方向」，详见
  paper-notes §3.2。


  ⚠️ 这不是论文复现：论文用 CPKL-Net（EfficientRep + Rep-PAN + MFMF + 网格三分支），本库用 YOLOv8 Pose 头承载关键点；2D
  损失用 OKS 而非论文的像素 MSE。不能宣称复现其精度。

  ⚠️ 数据集是 RflySim **仿真**（论文是真实 MAV6D），域差异显著。

  ⚠️ p1~p8 的逐一编号语义在 Fig. 2(a)（图片）里，按「前后×左右×上下」推定，状态见 docs/KEYPOINTS.md；校正只改数据集 YAML
  两行。

  ⚠️ tod.object_points 与 tod.camera_matrix 必须换成你机型的真实几何（论文没给这两张表，配置里是占位值）。


  关键点分支的压缩策略：**不压缩**（论文的 g=x/16 只针对检测头，且 c4=max(ch[0]//4, nk)=27 与输入 32 的公约数为 1，强行分组只会静默退化成
  g=1）。


  消融列（都只需改配置）：① EP7.reproj=False / reproj_weight=0（复现论文 baseline 列）；② tod.reproj_warmup_epochs=0（关
  warm-up）；③ EP7.pose=False（退回框架 KeypointLoss）；④ EP7.sigma_strategy=auto/balanced；⑤
  EP5.keypoint_per_group；⑥ v.without(''add_p2'') 看 P2 对框与关键点各自的代价。'
eps:
  EP1:
    downsample: ADown
    downsample_indices: [1, 3, 5, 7]
  EP5:
    head: Efficient_UAVDet
    per_group: 16
    channels: native
    levels: [2, 3, 4, 5]
    keypoint_branches: true
    keypoint_per_group: null
  EP7: {box: siou, theta: 4.0, pose: oks, sigma_strategy: uniform, min_sigma: 0.001,
    reproj: true, reproj_weight: 1.0}
data: {imgsz: 640}
model:
  nc: 1
  kpt_shape: [9, 3]
  add_p2: true
  p2_idx: 2
  p2_channels: 128
  p2_pre:
  - Conv
  - [128, 1, 1]
  p2_fuse_block: C2f
train: {optimizer: SGD, epochs: 200, batch: 4, imgsz: 640, lr0: 0.01, lrf: 0.01, momentum: 0.937,
  weight_decay: 0.0005, warmup_epochs: 3.0, warmup_momentum: 0.8, close_mosaic: 10,
  pose: 12.0, kobj: 1.0, workers: 4, seed: 0, deterministic: true, amp: true, project: results}
modules: [ADown, Efficient_UAVDet, siou]
