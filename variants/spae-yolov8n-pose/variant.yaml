spec_version: 2
id: spae-yolov8n-pose
base: yolov8n
task: pose
status: planned
dataset: rflysim-pose
tags: [self-designed, keypoint, pose, small-object, uav, air-to-air, spae, p2-head,
  adown, rflysim, sim2real]
notes: '= SPAE-YOLOv8n（SIoU + P2 浅层 + ADown + Efficient_UAVDet）+ 9 点机体关键点。


  ⚠️ 这不是 SPAE 论文的复现（该论文只出框，没有关键点），也不能宣称复现了 Keypoint-Guided（T-RO 2024）的精度：本库用的是 YOLO
  姿态头 + OKS 损失，而后者用的是自定义的质心引导关键点定位网络，结构不等价。


  ⚠️ 9 个关键点的**顺序是推断**（论文付费墙 + 作者仓库只有 README），定义在 docs/KEYPOINTS.md，状态 tod.kpt_definition_status=inferred；校正只需改数据集
  YAML 的 kpt_names / flip_idx 两行，无需改代码。


  ⚠️ 数据集是 RflySim **仿真**录制（域：simulation），与 SPAE 论文的 Det-Fly 真实空对空数据不同域；仿真数字不能直接当真实场景指标
  （Keypoint-Guided 论文专门做无监督域适应正是因为这个 gap）。


  关键点分支的压缩策略：**不压缩**（保持原生两层 3×3）。原因是论文的 g=x/16 只针对检测头，且关键点分支的中间通道 c4=max(ch[0]//4,
  nk)=max(8,27)=27 不被 16 的约数整除，强行分组会退化成 g=1 的**静默失效**（本库已把这种情况改成报错）。要压请显式给 EP5.keypoint_per_group（例如
  9 → g=3）。


  消融列（都只需改配置）：① EP7.pose=False（退回框架原生 KeypointLoss）；② EP7.sigma_strategy=auto/uniform/balanced；③
  EP5.keypoint_branches=False；④ 去掉 P2（v.without(''add_p2'')）看框与关键点各自的代价；⑤ EP7.box=ciou
  对照 SIoU 的贡献。'
eps:
  EP1:
    downsample: ADown
    downsample_indices: [1, 3, 5, 7]
  EP5:
    head: Efficient_UAVDet
    per_group: 16
    channels: native
    levels: [2, 3, 4, 5]
    keypoint_branches: true
    keypoint_per_group: null
  EP7: {box: siou, theta: 4.0, pose: oks, sigma_strategy: uniform, min_sigma: 0.001}
data: {imgsz: 640}
model:
  nc: 1
  kpt_shape: [9, 3]
  add_p2: true
  p2_idx: 2
  p2_channels: 128
  p2_pre:
  - Conv
  - [128, 1, 1]
  p2_fuse_block: C2f
train: {optimizer: SGD, epochs: 200, batch: 4, imgsz: 640, lr0: 0.01, lrf: 0.01, momentum: 0.937,
  weight_decay: 0.0005, warmup_epochs: 3.0, warmup_momentum: 0.8, close_mosaic: 10,
  pose: 12.0, kobj: 1.0, workers: 4, seed: 0, deterministic: true, amp: true, project: results}
modules: [ADown, Efficient_UAVDet, siou]
